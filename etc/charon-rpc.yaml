# charon-rpc 的开发配置。
#
# 注意：这个服务只承载 hello 自证方法，不带业务。
# 服务间业务调用走 HTTP，详见 README.md 的「架构约束」。

Name: charon-rpc

# 监听地址。容器内用 0.0.0.0，本机联调可用 127.0.0.1:9090。
ListenOn: 0.0.0.0:9090

Mode: dev

# 方法超时（毫秒）。
Timeout: 2000

# 是否启用 gRPC 健康检查（会被 k8s 的 grpc 探针使用）。
Health: true

Log:
  Mode: console
  Encoding: plain
  Level: debug
  Stat: false

# zrpc 内置拦截器开关。trace/recover 建议保持开启。
Middlewares:
  Trace: true
  Log: true
  Prometheus: true
  Breaker: true
  Recover: true
  Stat: true

Telemetry:
  Name: charon-rpc
  Disabled: true

# 服务发现。本地直连不需要 etcd，留空即可。
# 生产环境若要注册到 etcd，在这里补 Etcd 段。
