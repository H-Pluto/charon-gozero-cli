# charon 数据库凭据示例（**不要提交真实值**）。
#
# 用法（把真实 DSN 放进集群，而不是放进仓库）：
#
#   kubectl create secret generic charon-db \
#     --from-literal=DB_DATA_SOURCE='postgres://user:pass@host:5432/charon?sslmode=require'
#
# 或者复制本文件为 deploy/secret.yaml 填好，再 kubectl apply。
# deploy/secret.yaml 已在 .gitignore 里，不会被提交；.example 这份才可以进仓库。
#
# 为什么单独用 Secret 承接 DSN，而不是写进 ConfigMap：
#   etc/charon-api.yaml 里 DataSource 写成 $DB_DATA_SOURCE，
#   由 conf.UseEnv() 在启动时从环境变量展开（见 internal/config/config.go）。
#   这样密文只存在于 Secret，ConfigMap 里只有变量名，清清爽爽。
apiVersion: v1
kind: Secret
metadata:
  name: charon-db
  labels:
    app.kubernetes.io/part-of: charon
type: Opaque
stringData:
  # 用 stringData 方便写明文（k8s 会自动 base64）。真实环境建议改用
  # --from-literal / sealed-secrets / external-secrets 注入，避免明文落盘。
  DB_DATA_SOURCE: "postgres://postgres:CHANGE_ME@postgres.example.svc.cluster.local:5432/charon?sslmode=require"
